# Self-host: a GPU box running ComfyUI + the OpenJutsu web app in front of it.
services:
  comfy:
    build: { context: .., dockerfile: docker/Dockerfile.comfy }
    volumes: [ "comfy-models:/opt/ComfyUI/models", "comfy-output:/opt/ComfyUI/output" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ] } } }
    # Not published to the host: only the web service can reach ComfyUI (it has no auth of its own).
  web:
    image: node:24-alpine
    working_dir: /app
    volumes: [ "..:/app:ro" ]
    command: node server/server.js
    environment: { COMFY_URL: "http://comfy:8188", HOST: "0.0.0.0", PORT: "8500", OPENJUTSU_TOKEN: "${OPENJUTSU_TOKEN:?set a token before exposing this}" }
    ports: [ "8500:8500" ]
    depends_on: [ comfy ]
volumes: { comfy-models: {}, comfy-output: {} }
